name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # Enable manual trigger.

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Mandatory for OIDC.
      contents: read
    steps:
      - name: Checkout (official GitHub action)
        # Pinned to the v6 commit SHA; update with `git ls-remote` when bumping.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        # Pinned to the v8.1.0 commit SHA (see note in ci.yml).
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.12"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python (using uv)
        run: uv python install

      - name: Set supply-chain cool-off cutoff
        # uv's --exclude-newer takes a date, not a relative duration, so compute
        # "14 days ago" at run time. (Assumes a Linux runner with GNU date.)
        run: echo "UV_EXCLUDE_NEWER=$(date -u -d '14 days ago' +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Install all dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run --frozen pytest

      - name: Audit dependencies
        run: uv run --frozen pip-audit

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
        # Although uv is newer and faster, the "official" publishing option is the one from PyPA,
        # which uses twine. If desired, replace `uv publish` with:
        # uses: pypa/gh-action-pypi-publish@<pinned commit SHA>
