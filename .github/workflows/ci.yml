# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    # Use ["main", "master"] for CI only on the default branch.
    # Use ["**"] for CI on all branches.
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Update this as needed:
        # Common platforms: ["ubuntu-24.04", "macos-15", "windows-2025"]
        os: ["ubuntu-24.04"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # Linux only by default. Use ${{ matrix.os }} for other OSes.
    runs-on: ${{ matrix.os }}

    steps:
      # Generally following uv docs:
      # https://docs.astral.sh/uv/guides/integration/github/

      - name: Checkout (official GitHub action)
        # Pinned to the v6 commit SHA; update with `git ls-remote` when bumping.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        # Pinned to the v8.1.0 commit SHA; bump both the action SHA and uv version
        # intentionally when updating.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          # Update this as needed:
          version: "0.11.12"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (using uv)
        run: uv python install

      # Alternately can use the official Python action:
      # - name: Set up Python (using actions/setup-python)
      #   uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      #   with:
      #     python-version: ${{ matrix.python-version }}

      - name: Set supply-chain cool-off cutoff
        # uv's --exclude-newer takes a date, not a relative duration, so compute
        # "14 days ago" at run time. This keeps CI from resolving releases too new
        # to have been vetted. (Assumes a Linux runner with GNU date.)
        run: echo "UV_EXCLUDE_NEWER=$(date -u -d '14 days ago' +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Install all dependencies
        run: uv sync --frozen --all-extras

      - name: Run linting
        # Check-only mode so CI fails on unformatted code instead of fixing it.
        run: uv run python devtools/lint.py --check

      - name: Run tests
        run: uv run pytest

      - name: Audit dependencies
        run: uv run pip-audit
